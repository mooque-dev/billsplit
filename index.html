<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split the Bill</title>
<script>try{var th=localStorage.getItem('billsplit.theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="stylesheet" href="ds.css">
<style>
/* App layer — tokens + ds.css components only (see ds.css rules) */
body{padding:16px 16px 150px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.65rem;margin:.5rem 0 .15rem;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.top .acts{display:flex;gap:.4rem}
.sub{color:hsl(var(--muted-foreground));margin:0 0 1rem;font-size:.875rem}
.stack>*+*{margin-top:.9rem}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.toolbar{display:flex;gap:.5rem;align-items:center;margin:.9rem 0;flex-wrap:wrap}
.toolbar .input{flex:1;min-width:150px;border-radius:999px;background:hsl(var(--card))}
.tabbar{position:sticky;top:0;z-index:4;padding:.25rem 0 .75rem;background:hsl(var(--background))}

/* table card */
.tcard{margin-bottom:.9rem;overflow:hidden}
.trow{display:flex;align-items:center;gap:.4rem}
.tname{flex:1;min-width:0;font-size:1.15rem;height:2.25rem}
.ttot{font-weight:700;font-variant-numeric:tabular-nums}
.tmeta{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.75rem;color:hsl(var(--muted-foreground));margin:.1rem 0 .5rem}
.amt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:.7rem}
.amt .label{display:flex;align-items:center;gap:.3rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;display:inline-block}
.per{font-size:.72rem;color:hsl(var(--muted-foreground));margin-top:.3rem;min-height:1rem}
.bulk{display:flex;gap:.35rem;align-items:center;font-size:.8rem;color:hsl(var(--muted-foreground));flex-wrap:wrap;margin-top:.75rem}
.ppl{margin-top:.4rem}
.tfoot{padding:.75rem 1rem 1rem;border-top:1px solid hsl(var(--border))}
.tfoot .r{display:flex;gap:.5rem}
.qhint{font-size:.72rem;color:hsl(var(--muted-foreground));margin-top:.4rem}

/* person row */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"pay name owe more" ". tg tg tg";align-items:center;gap:.35rem .5rem;padding:.55rem 0;border-top:1px solid hsl(var(--border))}
.prow:first-child{border-top:0}
.dense .prow{grid-template-columns:auto minmax(0,1fr) auto auto auto;grid-template-areas:"pay name tg owe more";gap:.3rem .4rem;padding:.35rem 0}
.prow.hide{display:none}
.pay{grid-area:pay;width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid hsl(var(--input));background:transparent;color:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
.prow[data-state=paid] .pay{background:hsl(var(--success));border-color:hsl(var(--success));color:#fff}
.ncell{grid-area:name;min-width:0}
.ncell .input{height:2rem;font-size:1rem}
.stat{display:flex;gap:.3rem;align-items:center;padding-left:.25rem;min-height:0}
.stat:empty{display:none}
.tg{grid-area:tg}
.owe{grid-area:owe;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;text-align:right;min-width:4.6rem}
.dense .owe{font-size:.95rem;min-width:4.4rem}
.prow[data-state=paid] .owe{color:hsl(var(--success))}
.more{grid-area:more}
.long{display:inline}.short{display:none}
.dense .long{display:none}.dense .short{display:inline}
.dense .toggle{min-width:1.8rem;padding:0 .4rem}
.det{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem;margin:.4rem 0 .2rem 2.4rem}
.det .full{grid-column:1/-1}
@media(max-width:440px){
  .dense .toggle{min-width:1.55rem;height:1.8rem;padding:0 .2rem}
  .dense .toggle-group{gap:.15rem}.dense .prow{gap:.2rem}
  .dense .owe{font-size:.88rem;min-width:3.7rem}.dense .pay{width:1.7rem;height:1.7rem}
  #cmdKbd{display:none}.bar .tot b{font-size:1.05rem}
}
.rhead{display:flex;align-items:center;gap:.5rem;margin:1rem 0 .4rem}
.rhead b{font-size:.9rem}.rhead .muted{font-size:.75rem}.rhead .btn{margin-left:auto}
.rchips{display:flex;flex-wrap:wrap;gap:.35rem}
.rchip{display:inline-flex;align-items:center;gap:.3rem;height:2.1rem;padding:0 .7rem}
.rchip small{font-size:.65rem;font-weight:700;opacity:.75;border:1px solid currentColor;border-radius:999px;padding:0 .3rem}
.rchip:disabled{opacity:.45;cursor:default}
.rchip.edit{border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 3px);font-size:.85rem;font-weight:500;padding:0 .2rem 0 .7rem}
.rchip.edit button{border:0;background:transparent;color:hsl(var(--muted-foreground));cursor:pointer;font-size:1.05rem;padding:0 .4rem;height:100%}
.rchip.edit button:hover{color:hsl(var(--destructive))}
.rbody{overflow:auto;max-height:52vh;padding-right:.2rem}
.radd{margin-top:.5rem;max-width:260px}
.tfoot .r{flex-wrap:wrap}.tfoot .r .input{flex:1 1 150px}
.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{background:hsl(var(--warning-soft))}100%{background:transparent}}

/* breakdown */
.sum{display:flex;justify-content:space-between;padding:.2rem 0;font-size:.9375rem}
.sum.big{font-size:1.1rem;font-weight:700;border-top:1px solid hsl(var(--border));margin-top:.4rem;padding-top:.6rem}
.sum .m{color:hsl(var(--muted-foreground))}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:hsl(var(--card));border-top:1px solid hsl(var(--border));padding:.7rem 1rem calc(.8rem + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:640px;margin:0 auto}
.bar .line{display:flex;gap:.7rem;align-items:center;margin-top:.5rem}
.bar .tot{flex:1;font-size:.75rem;color:hsl(var(--muted-foreground))}
.bar .tot b{display:block;font-size:1.25rem;color:hsl(var(--foreground));letter-spacing:-.01em}

/* dialogs */
.ob-ic{font-size:2.5rem;margin:.2rem 0 .4rem}
.ob-b{font-size:.95rem;line-height:1.55;margin:0}
.steps{display:flex;gap:.4rem;justify-content:center;margin:1rem 0 .25rem}
.steps i{width:.45rem;height:.45rem;border-radius:50%;background:hsl(var(--border))}
.steps i.on{background:hsl(var(--foreground))}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.45rem .9rem;align-items:center;font-size:.9rem}
.keys h4{grid-column:1/-1;margin:.8rem 0 0;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.keys .k{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:flex-end}
.mlist{overflow:auto;max-height:44vh}
.mrow{border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);padding:.6rem;margin-top:.5rem}
.mrow.ok{border-color:hsl(var(--success))}
.mrow .s{font-weight:600}
.mrow .raw{font-size:.72rem;color:hsl(var(--muted-foreground));font-weight:400;word-break:break-all}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:.5rem;margin-top:.5rem}
.mnote{font-size:.75rem;margin-top:.4rem;color:hsl(var(--muted-foreground));display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.mnote .good{color:hsl(var(--success));font-weight:600}.mnote .bad{color:hsl(var(--destructive));font-weight:600}.mnote .maybe{color:hsl(var(--warning));font-weight:600}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div class="acts">
      <button class="btn btn-outline btn-icon" id="themeBtn" aria-label="Theme"></button>
      <button class="btn btn-outline btn-icon" id="keysBtn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
      <button class="btn btn-outline btn-icon" id="help" aria-label="Guide">?</button>
      <button class="btn btn-outline" id="lang">한국어</button>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <section class="card"><div class="card-content">
    <div class="row2">
      <div>
        <label class="label" for="in-tax" data-i18n="tax"></label>
        <div class="input-group"><input id="in-tax" inputmode="decimal"><span>%</span></div>
        <div class="chips" id="taxchips"></div>
      </div>
      <div>
        <label class="label" for="in-tip" data-i18n="tip"></label>
        <div class="input-group"><input id="in-tip" inputmode="decimal"><span>%</span></div>
        <div class="chips" id="tipchips"></div>
      </div>
    </div>
  </div></section>

  <div class="toolbar">
    <input class="input" id="q" type="search" data-i18n-ph="search" autocomplete="off">
    <div class="toggle-group" id="filterchips"></div>
    <button class="toggle" id="dense" data-i18n="compact"></button>
  </div>

  <div class="tabbar"><div class="tabs-list" id="tabs" role="tablist"></div></div>
  <div id="tables"></div>
  <button class="btn btn-outline" id="addtable" style="width:100%;margin-bottom:.9rem" data-i18n="addtable"></button>

  <section class="card"><div class="card-content">
    <h2 class="card-title" data-i18n="breakdown"></h2>
    <div id="warn"></div>
    <div id="breakdown"></div>
  </div></section>

  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem">
    <button class="btn btn-outline" id="copy" data-i18n="copy"></button>
    <button class="btn btn-outline" id="copyunpaid" data-i18n="copyunpaid"></button>
    <button class="btn btn-outline" id="new" data-i18n="newbill"></button>
    <button class="btn btn-destructive-ghost" id="clear" data-i18n="clearall"></button>
  </div>
</main>

<div class="bar"><div class="in">
  <div class="progress"><i id="gprog"></i></div>
  <div class="line">
    <div class="tot"><span data-i18n="collected"></span> <span id="gpaid"></span><b id="gleft"></b></div>
    <button class="btn btn-outline" id="cmdBtn" title="Ctrl/⌘ K">⌕ <span class="kbd" id="cmdKbd">⌘K</span></button>
    <button class="btn" id="match" data-i18n="match"></button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<!-- Onboarding -->
<dialog class="dialog" id="dlg-ob">
  <div class="ob-ic" id="ob-ic"></div>
  <h3 class="dialog-title" id="ob-t"></h3>
  <p class="ob-b" id="ob-b"></p>
  <div class="steps" id="ob-dots"></div>
  <div class="dialog-footer" style="justify-content:space-between">
    <button class="btn btn-ghost" id="ob-skip"></button>
    <div style="display:flex;gap:.5rem"><button class="btn btn-outline" id="ob-back"></button><button class="btn" id="ob-next"></button></div>
  </div>
</dialog>

<!-- Team roster -->
<dialog class="dialog" id="dlg-roster">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
    <h3 class="dialog-title" data-i18n="rosterTitle"></h3>
    <button class="toggle" id="rosterMode" data-i18n="rosterEdit"></button>
  </div>
  <p class="dialog-desc" id="rosterDesc"></p>
  <form class="alert" id="rosterLock" hidden style="margin-bottom:.6rem">
    <div id="lockText" style="margin-bottom:.5rem"></div>
    <div style="display:flex;gap:.5rem"><input class="input input-sm" id="lockPw" type="password" autocomplete="off" data-i18n-ph="unlockPh" style="flex:1"><button class="btn btn-sm" type="submit" data-i18n="unlockBtn"></button></div>
  </form>
  <input class="input" id="rosterQ" type="search" data-i18n-ph="rosterSearch" autocomplete="off" style="margin-bottom:.25rem">
  <div class="rbody" id="rosterBody"></div>
  <div class="dialog-footer" style="align-items:center">
    <select class="select select-sm" id="rosterTarget" style="width:auto;margin-right:auto"></select>
    <button class="btn btn-outline" id="rosterImport" data-i18n="rosterImport" hidden></button>
    <button class="btn btn-destructive-ghost" id="rosterReset" data-i18n="rosterReset" hidden></button>
    <button class="btn btn-outline" data-close data-i18n="cancel" id="rosterCancel"></button>
    <button class="btn" id="rosterAdd"></button>
  </div>
</dialog>
<datalist id="rosterNames"></datalist>

<!-- Import roster chart -->
<dialog class="dialog" id="dlg-rimport">
  <h3 class="dialog-title" data-i18n="rosterImportTitle"></h3>
  <p class="dialog-desc" data-i18n="rosterImportHint"></p>
  <textarea class="textarea" id="rimpTxt" style="min-height:11rem" placeholder="Directing (2)&#10;* Hana Yoon&#10;* Ian Jung&#10;&#10;Cast (2)&#10;* Alex Kim (A)&#10;* Bora Lee (B)"></textarea>
  <div class="dialog-footer"><button class="btn btn-outline" data-close data-i18n="cancel"></button><button class="btn" id="rimpGo" data-i18n="rosterImportGo"></button></div>
</dialog>

<!-- Shortcuts -->
<dialog class="dialog" id="dlg-keys">
  <h3 class="dialog-title" data-i18n="keysTitle"></h3>
  <p class="dialog-desc" data-i18n="keysDesc"></p>
  <div class="keys" id="keysBody"></div>
  <div class="dialog-footer"><button class="btn" data-close data-i18n="done"></button></div>
</dialog>

<!-- Command palette -->
<dialog class="dialog" id="dlg-cmd" style="padding:.75rem">
  <input class="command-input" id="cmdIn" autocomplete="off" data-i18n-ph="cmdPh">
  <div class="command-list" id="cmdList" role="listbox"></div>
  <div class="muted" style="font-size:.72rem;padding:.6rem .25rem 0;display:flex;gap:.8rem;flex-wrap:wrap" id="cmdFoot"></div>
</dialog>

<!-- Paste names -->
<dialog class="dialog" id="dlg-paste">
  <h3 class="dialog-title" data-i18n="pasteTitle"></h3>
  <p class="dialog-desc" data-i18n="pasteHint"></p>
  <textarea class="textarea" id="pasteTxt" placeholder="Jisoo Park&#10;Minho Lee, minho@mail.com&#10;Tom Baek"></textarea>
  <div class="dialog-footer"><button class="btn btn-outline" data-close data-i18n="cancel"></button><button class="btn" id="pasteGo" data-i18n="add"></button></div>
</dialog>

<!-- Match payments -->
<dialog class="dialog" id="dlg-match">
  <h3 class="dialog-title" data-i18n="matchTitle"></h3>
  <p class="dialog-desc" data-i18n="matchHint"></p>
  <textarea class="textarea" id="matchTxt" placeholder="Jisoo Park sent you $28.50&#10;minho.lee@mail.com, 31.20&#10;JS PARK  $25"></textarea>
  <div class="mlist" id="matchList"></div>
  <div class="dialog-footer"><button class="btn btn-outline" data-close data-i18n="cancel"></button><button class="btn btn-outline" id="matchParse" data-i18n="parse"></button><button class="btn" id="matchApply" data-i18n="apply" hidden></button></div>
</dialog>

// ---------- team roster (preset)
function defaultRoster(){
  const g = (name,list)=>({id:uid(),name,members:list.map(x=>{ const [n,tag] = Array.isArray(x)?x:[x,'']; return {id:uid(),name:n,alias:'',email:'',tag}; })});
  return {groups:[
    g('Cast · Leads',[['Alex Kim','A'],['Bora Lee','A'],['Chris Park','B'],['Dana Choi (Dee)','B']]),
    g('Cast · Ensemble',['Eli Han','Fiona Seo','Gus Moon']),
    g('Directing',['Hana Yoon','Ian Jung']),
    g('Production',['Jin Baek','Kay Song (Katie)','Leo Shin'])
  ]};
}
const allMembers = () => S.roster.groups.flatMap(g=>g.members);
const findMember = id => allMembers().find(m=>m.id===id);
function rosterAliases(m){
  const seen = new Set([nn(m.name)]), out = [];
  [...m.name.split(/[()\/]/),...String(m.alias||'').split(/[,;]/)].map(x=>x.trim()).filter(Boolean).forEach(x=>{ const k = nn(x); if(k && !seen.has(k)){ seen.add(k); out.push(x); } });
  return out.join(', ');
}
function findRoster(name){
  const key = nn(name); if(key.length<2) return null;
  const hits = allMembers().filter(m=>[m.name,...m.name.split(/[()\/]/),...String(m.alias||'').split(/[,;]/)].map(nn).filter(Boolean).includes(key));
  return hits.length && new Set(hits.map(h=>nn(h.name))).size===1 ? hits[0] : null;
}
function syncRoster(p){ if(!p.rid) return; const m = findMember(p.rid); if(m){ m.email = p.email||''; m.alias = p.alias||''; } }

// ---------- calc
function calc(){
  const mult = 1 + num(S.tax)/100 + num(S.tip)/100;
  const owe = {}, tabs = {}; const lost = [];
  S.tables.forEach(tb=>{
    const A = {f:num(tb.amt.f),b:num(tb.amt.b),s:num(tb.amt.s)}, n = {f:0,b:0,s:0};
    const mem = S.people.filter(p=>p.tid===tb.id);
    mem.forEach(p=>CATS.forEach(([k])=>{ if(p[k]) n[k]++; }));
    const share = {}; CATS.forEach(([k,l])=>{ share[k] = n[k] ? A[k]/n[k] : 0; if(A[k]>0 && !n[k]) lost.push(tname(tb)+' · '+t(l)); });
    mem.forEach(p=>{ const base = CATS.reduce((s,[k])=>s+(p[k]?share[k]:0),0); owe[p.id] = Math.round(base*mult*100)/100; });
    tabs[tb.id] = {A,n,share,sub:A.f+A.b+A.s,bill:(A.f+A.b+A.s)*mult,mem};
  });
  const got = {}; S.people.forEach(p=>{ got[p.id] = p.paid ? (p.got!=='' ? num(p.got) : (owe[p.id]||0)) : 0; });
  const vals = o => Object.values(o);
  const bill = vals(tabs).reduce((s,x)=>s+x.bill,0), sub = vals(tabs).reduce((s,x)=>s+x.sub,0);
  const owed = vals(owe).reduce((s,x)=>s+x,0), collected = vals(got).reduce((s,x)=>s+x,0);
  return {mult,owe,tabs,lost,got,bill,sub,owed,collected,left:owed-collected};
}

function update(){
  const c = calc();
  S.tables.forEach(tb=>{
    const el = document.querySelector(`[data-tid="${tb.id}"]`); if(!el) return;
    const x = c.tabs[tb.id];
    CATS.forEach(([k])=>{ el.querySelector(`[data-per="${k}"]`).textContent = x.n[k] ? `${x.n[k]}${LANG==='ko'?'':' '}${t('ppl')} · ${$$(x.share[k])} ${t('each')}` : (x.A[k]>0 ? t('nobodyPicked') : ''); });
    el.querySelector('[data-ttot]').textContent = $$(x.bill);
    const paidN = x.mem.filter(p=>p.paid).length, tOwed = x.mem.reduce((s,p)=>s+(c.owe[p.id]||0),0), tGot = x.mem.reduce((s,p)=>s+c.got[p.id],0);
    el.querySelector('[data-tmeta]').innerHTML = `<span>${x.mem.length}${LANG==='ko'?'':' '}${t('ppl')}</span><span>✓ ${paidN}/${x.mem.length}</span><span>${$$(tGot)} / ${$$(tOwed)}</span>`;
    el.querySelector('[data-tprog]').style.width = tOwed>0 ? Math.min(100,tGot/tOwed*100)+'%' : '0';
    CATS.forEach(([k])=>{ const b = el.querySelector(`.bulk [data-k="${k}"]`); if(b) b.dataset.state = x.mem.length && x.mem.every(p=>p[k]) ? 'on' : 'off'; });
  });
  const q = UI.q.trim().toLowerCase();
  S.people.forEach(p=>{
    const row = document.querySelector(`[data-pid="${p.id}"]`); if(!row) return;
    const owe = c.owe[p.id]||0, got = c.got[p.id];
    row.dataset.state = p.paid ? 'paid' : 'unpaid';
    row.querySelector('.pay').setAttribute('aria-pressed', p.paid);
    row.querySelector('[data-owe]').textContent = $$(owe);
    let st = '';
    if(p.paid){ const d = got-owe; if(Math.abs(d)>=0.005) st += `<span class="badge badge-warning">${d>0?'+':'−'}${$$(Math.abs(d))}</span>`; }
    if(p.email || p.alias) st += `<span class="badge badge-outline" title="${esc(p.email+' '+p.alias)}">🔗</span>`;
    row.querySelector('[data-stat]').innerHTML = st;
    const hit = !q || [p.name,p.email,p.alias].some(v=>String(v||'').toLowerCase().includes(q));
    const fok = UI.filter==='all' || (UI.filter==='paid'?p.paid:!p.paid);
    row.classList.toggle('hide', !(hit&&fok));
  });
  $('#gpaid').textContent = `${$$(c.collected)} / ${$$(c.owed)}`;
  $('#gleft').textContent = c.left>0.004 ? `${$$(c.left)} ${t('left')}` : '✓ '+t('collectedRow');
  $('#gprog').style.width = c.owed>0 ? Math.min(100,c.collected/c.owed*100)+'%' : '0';
  $('#warn').innerHTML = c.lost.length ? `<div class="alert alert-warning" style="margin-bottom:.6rem">${t('noOne',c.lost.join(t('sep')))}</div>` : '';
  const tax = c.sub*num(S.tax)/100, tip = c.sub*num(S.tip)/100, diff = c.owed - c.bill;
  let h = `<div class="sum"><span class="m">${t('subtotal')}</span><span>${$$(c.sub)}</span></div>`;
  if(tax) h += `<div class="sum"><span class="m">${t('taxL')} ${num(S.tax)}%</span><span>${$$(tax)}</span></div>`;
  if(tip) h += `<div class="sum"><span class="m">${t('tipL')} ${num(S.tip)}%</span><span>${$$(tip)}</span></div>`;
  h += `<div class="sum big"><span>${t('billTotal')}</span><span>${$$(c.bill)}</span></div>`;
  if(Math.abs(diff)>=0.02) h += `<div class="sum"><span class="m">${diff>0?t('extra'):t('short')}</span><span>${$$(Math.abs(diff))}</span></div>`;
  h += `<div class="sum"><span class="m">${t('collectedRow')}</span><span>${$$(c.collected)}</span></div>`;
  h += `<div class="sum"><span class="m">${t('outstanding')}</span><span>${$$(Math.max(0,c.left))}</span></div>`;
  $('#breakdown').innerHTML = h;
  renderChips(); save();
}

// ---------- adding people (quick syntax)
function parseQuick(line){
  let l = line.trim().replace(/^[-*•]\s+|^\d+[.)]\s+/,'');
  const tags = {};
  const em = (l.match(/[^\s,;<>]+@[^\s,;<>]+/)||[''])[0];
  const name = l.replace(em,'').replace(/[<>,;]+/g,' ').replace(/\s+/g,' ').trim();
  return {name: name || (em ? em.split('@')[0] : ''), email: em, tags};
}
function addFromLine(tid, line){
  const q = parseQuick(line); if(!q.name) return null;
  const m = findRoster(q.name);
  const p = mkPerson(tid, m ? m.name : q.name, q.email || (m && m.email) || '', q.tags);
  if(m){ p.rid = m.id; p.alias = rosterAliases(m); }
  S.people.push(p); return p;
}

// ---------- payment matching
const nn = s => String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const keysOf = p => [p.name,...String(p.alias||'').split(/[,;\n]/)].map(s=>s.trim()).filter(Boolean);
function scoreKey(sN, kN){
  if(kN.length<2||!sN) return 0;
  if(sN===kN) return 1;
  const sT = sN.split(' '), kT = kN.split(' ');
  if([...sT].sort().join(' ')===[...kT].sort().join(' ')) return .97;
  if(sN.replace(/ /g,'')===kN.replace(/ /g,'')) return .95;
  const [short,long] = sT.length<=kT.length ? [sT,kT] : [kT,sT];
  if(short.every(w=>long.includes(w)) && (short.length>1 || short[0].length>=3)) return .8;
  const a = sN.replace(/ /g,''), b = kN.replace(/ /g,'');
  const r = 1 - lev(a,b)/Math.max(a.length,b.length);
  return r>=.8 ? r*.9 : 0;
}
function matchPerson(sender,email){
  const sN = nn(sender), em = email.toLowerCase(); const scores = [];
  S.people.forEach(p=>{
    let s = 0;
    if(em){
      if(p.email && p.email.toLowerCase()===em) s = 1;
      keysOf(p).forEach(k=>{ if(k.toLowerCase()===em) s = 1; });
      const local = nn(em.split('@')[0].replace(/[._\d]+/g,' ')).replace(/ /g,'');
      if(!s && local.length>=3) keysOf(p).forEach(k=>{ if(nn(k).replace(/ /g,'')===local) s=Math.max(s,.75); });
    }
    keysOf(p).forEach(k=>{ s = Math.max(s, scoreKey(sN, nn(k))); });
    if(s>0) scores.push([s,p]);
  });
  scores.sort((a,b)=>b[0]-a[0]);
  if(!scores.length) return {conf:'none'};
  if(scores[1] && scores[0][0]-scores[1][0]<.05 && scores[0][0]<1) return {conf:'none'};
  return {pid:scores[0][1].id, conf: scores[0][0]>=.9?'exact':(scores[0][0]>=.7?'maybe':'none')};
}
function parsePayments(txt){
  const out = [];
  txt.split('\n').forEach(raw=>{
    let l = raw.trim(); if(!l) return;
    const email = (l.match(/[^\s,;<>()]+@[^\s,;<>()]+/)||[''])[0]; l = l.replace(email,' ');
    let amt = 0;
    const withS = [...l.matchAll(/\$\s*(\d+(?:[.,]\d{1,2})?)/g)], any = [...l.matchAll(/(\d+(?:[.,]\d{1,2})?)/g)];
    const m = withS.length ? withS[withS.length-1] : any[any.length-1];
    if(m){ amt = parseFloat(m[1].replace(',','.')); l = l.replace(m[0],' '); }
    const name = l.replace(/\b(has\s+)?sent\s+you\b.*$/i,' ').replace(/\b(cad|interac|e-?transfer|etransfer|received|deposit(ed)?|from|money|transfer)\b/gi,' ')
      .replace(/[$|;,\t()<>:]+/g,' ').replace(/\s+-\s+/g,' ').replace(/\s+/g,' ').trim();
    if(!name && !email) return;
    const sender = name || email;
    out.push({raw, sender, email, amt, ...matchPerson(sender,email), remember:true});
  });
  return out;
}

// ---------- roster import (paste a chart: headings like "연출팀 (7)" then names)
function parseChart(text){
  const tok = text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const bullet = /^[*•\-]\s*/.test(l), h = !bullet && /^(.*?)\s*\((\d+)\)\s*$/.exec(l);
    return h ? {h:true,name:h[1].trim(),n:+h[2]} : {m:l.replace(/^[*•\-]\s*/,'')};
  });
  const groups = []; let cur = null, parent = null;
  tok.forEach((x,i)=>{
    if(x.h){
      if(tok[i+1] && tok[i+1].h){ parent = {name:x.name,left:x.n}; cur = null; return; }
      const full = parent && parent.left>0 ? parent.name+' · '+x.name : x.name;
      if(parent){ parent.left -= x.n; if(parent.left<=0) parent = null; }
      cur = {id:uid(),name:full,members:[]}; groups.push(cur);
    } else {
      if(!cur){ cur = {id:uid(),name:t('table')==='Table'?'Team':'명단',members:[]}; groups.push(cur); }
      let name = x.m, tag = '';
      const tg = /\s*\(([A-Z])\)\s*$/.exec(name); if(tg){ tag = tg[1]; name = name.slice(0,tg.index); }
      name = name.replace(/\s*\((음악|보컬|연기)\)\s*$/,'').trim();
      if(name) cur.members.push({id:uid(),name,alias:'',email:'',tag});
    }
  });
  return groups.filter(g=>g.members.length);
}

// ---------- unlock encrypted team roster (roster.enc.json, AES-GCM + PBKDF2)
let ENC_OK = null;
async function encAvailable(){
  if(ENC_OK!==null) return ENC_OK;
  try{ ENC_OK = (await fetch('roster.enc.json',{method:'HEAD',cache:'no-cache'})).ok; }catch{ ENC_OK = false; }
  return ENC_OK;
}
async function decryptRoster(pw){
  const j = await fetch('roster.enc.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error('fetch'); return r.json(); });
  const b = x => Uint8Array.from(atob(x), ch=>ch.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(j.salt),iterations:j.iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(j.iv)}, key, b(j.data)));
}
$('#rosterLock').addEventListener('submit', async e=>{
  e.preventDefault(); const pw = $('#lockPw').value; if(!pw) return;
  let text;
  try{ text = await decryptRoster(pw); }
  catch(err){ toast(t(err && err.message==='fetch' ? 'unlockErr' : 'unlockBad')); $('#lockPw').select(); return; }
  const g = parseChart(text); if(!g.length){ toast(t('rosterImportEmpty')); return; }
  if(S.rosterCustom && !confirm(t('confirmUnlock'))) return;
  S.roster = {groups:g}; S.rosterCustom = true; $('#lockPw').value=''; renderRoster(); renderAll(); toast(t('unlockDone'));
});

// ---------- roster dialog
const RS = {mode:'pick',sel:new Set(),tid:null,q:''};
const presentNames = () => new Set(S.people.map(p=>nn(p.name)));
function renderRoster(){
  const edit = RS.mode==='edit', q = RS.q.trim().toLowerCase(), present = presentNames();
  const $b = $('#rosterBody'); const scroll = $b.scrollTop;
  $('#rosterMode').dataset.state = edit ? 'on' : 'off'; $('#rosterMode').textContent = edit ? t('rosterDone') : t('rosterEdit');
  $('#rosterDesc').textContent = edit ? t('rosterDescEdit') : t('rosterDescPick');
  $('#rosterTarget').hidden = edit || S.tables.length<2;
  $('#rosterTarget').innerHTML = S.tables.map(tb=>`<option value="${tb.id}" ${tb.id===RS.tid?'selected':''}>${esc(tname(tb))}</option>`).join('');
  let h = '';
  S.roster.groups.forEach(g=>{
    const ms = g.members.filter(m=>!q || [m.name,m.alias,m.email,m.tag].join(' ').toLowerCase().includes(q));
    if(q && !ms.length && !edit) return;
    const free = ms.filter(m=>!present.has(nn(m.name))), allSel = free.length && free.every(m=>RS.sel.has(m.id));
    h += edit
      ? `<div class="rhead"><input class="input input-ghost" style="max-width:220px" data-gname="${g.id}" value="${esc(g.name)}"><span class="muted">${g.members.length}</span><button class="btn btn-destructive-ghost btn-sm" data-gdel="${g.id}">${t('remove')}</button></div>`
      : `<div class="rhead"><b>${esc(g.name)}</b><span class="muted">${ms.length}</span>${free.length?`<button class="btn btn-ghost btn-sm" data-rsel="${g.id}">${allSel?t('rosterClear'):t('rosterSelAll')}</button>`:''}</div>`;
    h += '<div class="rchips">' + ms.map(m=>{
      const tag = m.tag ? `<small>${esc(m.tag)}</small>` : '';
      if(edit) return `<span class="rchip edit"><span data-rename="${m.id}" style="cursor:text" title="${t('rename')||''}">${esc(m.name)}</span>${tag}<button data-rdel="${m.id}" aria-label="${t('remove')}">×</button></span>`;
      const here = present.has(nn(m.name));
      return `<button class="toggle rchip" data-mid="${m.id}" data-state="${RS.sel.has(m.id)?'on':'off'}" ${here?'disabled':''}>${here?'✓ ':''}${esc(m.name)}${tag}</button>`;
    }).join('') + '</div>';
    if(edit) h += `<input class="input input-sm radd" data-gadd="${g.id}" placeholder="${esc(t('rosterAddM'))}" autocomplete="off">`;
  });
  if(edit) h += `<div class="rhead" style="margin-top:1.2rem"><input class="input input-sm" style="max-width:260px" data-gnew placeholder="${esc(t('rosterAddG'))}" autocomplete="off"></div>`;
  else if(!h) h = `<div class="muted" style="padding:1rem 0;font-size:.9rem">${t('rosterNone')}</div>`;
  $b.innerHTML = h; $b.scrollTop = scroll;
  $('#rosterLock').hidden = edit || !ENC_OK || !!S.rosterCustom; $('#lockText').textContent = t('unlockText');
  $('#rosterAdd').hidden = edit; $('#rosterReset').hidden = !edit; $('#rosterImport').hidden = !edit;
  $('#rosterAdd').textContent = t('rosterAddN', RS.sel.size + (LANG==='ko'?'명':'')); $('#rosterAdd').disabled = !RS.sel.size;
  $('#rosterCancel').textContent = edit ? t('done') : t('cancel');
}
function openRoster(tid){
  RS.mode='pick'; RS.sel.clear(); RS.q=''; RS.tid = tid || (UI.view!=='all' ? UI.view : S.tables[0].id);
  $('#rosterQ').value=''; renderRoster(); if(!$('#dlg-roster').open) $('#dlg-roster').showModal(); $('#rosterQ').focus();
  encAvailable().then(ok=>{ if(ok) renderRoster(); });
}
$('#rosterQ').addEventListener('input', e=>{ RS.q=e.target.value; renderRoster(); });
$('#rosterMode').onclick = ()=>{ RS.mode = RS.mode==='edit'?'pick':'edit'; renderRoster(); };
$('#rosterTarget').onchange = e=>{ RS.tid = e.target.value; };
$('#rosterBody').addEventListener('click', e=>{
  if(RS.mode==='edit') S.rosterCustom = true;
  const b = e.target.closest('button,[data-rename]'); if(!b) return; const d = b.dataset;
  if(d.mid){ RS.sel.has(d.mid) ? RS.sel.delete(d.mid) : RS.sel.add(d.mid); renderRoster(); }
  else if(d.rsel){ const g = S.roster.groups.find(x=>x.id===d.rsel), present = presentNames(), q = RS.q.trim().toLowerCase();
    const free = g.members.filter(m=>!present.has(nn(m.name)) && (!q || [m.name,m.alias,m.email,m.tag].join(' ').toLowerCase().includes(q)));
    const all = free.every(m=>RS.sel.has(m.id)); free.forEach(m=>all ? RS.sel.delete(m.id) : RS.sel.add(m.id)); renderRoster(); }
  else if(d.rdel){ S.roster.groups.forEach(g=>g.members = g.members.filter(m=>m.id!==d.rdel)); renderRoster(); renderAll(); }
  else if(d.gdel){ if(confirm(t('confirmDelGroup'))){ S.roster.groups = S.roster.groups.filter(g=>g.id!==d.gdel); renderRoster(); renderAll(); } }
  else if(d.rename){ const m = findMember(d.rename), n = prompt('', m.name); if(n && n.trim()){ m.name = n.trim(); renderRoster(); renderAll(); } }
});
$('#rosterBody').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return; S.rosterCustom = true; const el = e.target, v = el.value.trim(); if(!v) return;
  if(el.dataset.gadd){ const g = S.roster.groups.find(x=>x.id===el.dataset.gadd); g.members.push({id:uid(),name:v,alias:'',email:'',tag:''}); renderRoster(); renderAll(); const n = $(`[data-gadd="${g.id}"]`); if(n) n.focus(); }
  else if('gnew' in el.dataset){ S.roster.groups.push({id:uid(),name:v,members:[]}); renderRoster(); renderAll(); const n = $('[data-gadd]:last-of-type'); [...document.querySelectorAll('[data-gadd]')].pop()?.focus(); }
});
$('#rosterBody').addEventListener('change', e=>{ if(e.target.dataset.gname){ const g = S.roster.groups.find(x=>x.id===e.target.dataset.gname); g.name = e.target.value.trim() || g.name; save(); } });
$('#rosterReset').onclick = ()=>{ if(confirm(t('rosterConfirmReset'))){ S.roster = defaultRoster(); S.rosterCustom = false; renderRoster(); renderAll(); } };
$('#rosterAdd').onclick = ()=>{
  const present = presentNames(), seen = new Set(), picked = [];
  allMembers().forEach(m=>{ const k = nn(m.name); if(RS.sel.has(m.id) && !present.has(k) && !seen.has(k)){ seen.add(k); picked.push(m); } });
  picked.forEach(m=>{ const pp = mkPerson(RS.tid, m.name, m.email||''); pp.rid = m.id; pp.alias = rosterAliases(m); S.people.push(pp); });
  $('#dlg-roster').close(); UI.view = UI.view==='all' ? 'all' : RS.tid; renderAll(); toast(t('rosterAdded', picked.length+(LANG==='ko'?'명':'')));
};

// ---------- command palette (find person / actions)
let CMD = {items:[],sel:0};
function cmdBuild(){
  const q = $('#cmdIn').value.trim().toLowerCase(), c = calc();
  const people = S.people.map(p=>{ const tb = S.tables.find(x=>x.id===p.tid);
    return {kind:'p',p,label:p.name||'?',sub:`${tname(tb)} · ${$$(c.owe[p.id]||0)}`,hay:[p.name,p.email,p.alias,tname(tb)].join(' ').toLowerCase()}; })
    .filter(i=>!q||i.hay.includes(q)).slice(0,40);
  const acts = [
    {kind:'a',label:t('aNewTable'),sub:'T',run:()=>newTable()},
    {kind:'a',label:t('aRoster'),sub:'R',run:()=>openRoster()},
    {kind:'a',label:t('aMatch'),sub:'M',run:()=>openMatch()},
    {kind:'a',label:t('aDense'),sub:'C',run:()=>toggleDense()},
    {kind:'a',label:t('aKeys'),sub:'?',run:()=>openKeys()},
    {kind:'a',label:t('aGuide'),sub:'',run:()=>openOB()}
  ].filter(i=>!q||i.label.toLowerCase().includes(q));
  CMD.items = [...people,...acts]; CMD.sel = Math.min(CMD.sel, Math.max(0,CMD.items.length-1));
}
function cmdRender(){
  let h = '', lastKind = '';
  CMD.items.forEach((i,idx)=>{
    if(i.kind!==lastKind){ h += `<div class="command-group">${t(i.kind==='p'?'cmdPeople':'cmdActions')}</div>`; lastKind = i.kind; }
    h += `<div class="command-item" role="option" data-ci="${idx}" data-selected="${idx===CMD.sel}">${i.kind==='p'?`<span style="color:hsl(var(--success))">${i.p.paid?'✓':'○'}</span>`:''}<span>${esc(i.label)}</span><span class="sub">${esc(i.sub)}</span></div>`;
  });
  $('#cmdList').innerHTML = h || `<div class="command-group">${t('cmdNone')}</div>`;
  const sel = $('#cmdList [data-selected=true]'); if(sel) sel.scrollIntoView({block:'nearest'});
  $('#cmdFoot').innerHTML = `<span><span class="kbd">↑</span><span class="kbd">↓</span> ${t('cmdNav')}</span><span><span class="kbd">Enter</span> ${t('cmdGo')}</span><span><span class="kbd">${ALT}</span><span class="kbd">Enter</span> ${t('cmdPaid')}</span>`;
}
function openCmd(){ $('#cmdIn').value=''; CMD.sel=0; cmdBuild(); cmdRender(); if(!$('#dlg-cmd').open) $('#dlg-cmd').showModal(); $('#cmdIn').focus(); }
function goPerson(p){
  $('#dlg-cmd').close(); UI.q=''; $('#q').value=''; UI.filter='all'; UI.collapsed.delete(p.tid);
  if(UI.view!=='all') UI.view = p.tid; renderAll();
  const row = document.querySelector(`[data-pid="${p.id}"]`); if(!row) return;
  row.scrollIntoView({block:'center'}); focusName(p.id); row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1500);
}
$('#cmdIn').addEventListener('input', ()=>{ CMD.sel=0; cmdBuild(); cmdRender(); });
$('#cmdIn').addEventListener('keydown', e=>{
  const n = CMD.items.length;
  if(e.key==='ArrowDown'){ e.preventDefault(); CMD.sel = (CMD.sel+1)%Math.max(1,n); cmdRender(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); CMD.sel = (CMD.sel-1+n)%Math.max(1,n); cmdRender(); }
  else if(e.key==='Enter'){ e.preventDefault(); const i = CMD.items[CMD.sel]; if(!i) return;
    if(i.kind==='a'){ $('#dlg-cmd').close(); i.run(); }
    else if(e.altKey){ i.p.paid=!i.p.paid; if(!i.p.paid) i.p.got=''; update(); cmdBuild(); cmdRender(); }
    else goPerson(i.p); }
});
$('#cmdList').addEventListener('click', e=>{ const el = e.target.closest('[data-ci]'); if(!el) return; CMD.sel=+el.dataset.ci; const i = CMD.items[CMD.sel]; if(i.kind==='a'){ $('#dlg-cmd').close(); i.run(); } else goPerson(i.p); });
$('#cmdBtn').onclick = openCmd;

// ---------- shortcuts dialog + onboarding
function openKeys(){
  const K = (...a)=>`<span class="k">${a.map(x=>`<span class="kbd">${x}</span>`).join('')}</span>`;
  const rows = [
    ['gGlobal',[[K(MOD,'K'),'kFind'],[K('/'),'kSearch'],[K('['),'kTabs',K(']')],[K('T'),'kNewT'],[K('R'),'kRoster'],[K('M'),'kMatch'],[K('C'),'kDense'],[K('?'),'kKeys']]],
    ['gName',[[K('↑','↓','Enter'),'kMove'],[K(ALT,'F')+K('B')+K('S'),'kTag'],[K(ALT,'P'),'kPaid'],[K(ALT,'D'),'kDet']]],
    ['gQuick',[[K('Enter'),'kAdd'],[K('Paste'),'kPasteMany'],[K('Esc'),'kClear']]],
    ['gPalette',[[K('↑','↓'),'kNavP'],[K('Enter'),'kGoP'],[K(ALT,'Enter'),'kPaidP']]]
  ];
  $('#keysBody').innerHTML = rows.map(([g,items])=>`<h4>${t(g)}</h4>`+items.map(([k,d,extra])=>`${k}<span>${t(d)}${extra?' '+extra:''}</span>`).join('')).join('');
  if(!$('#dlg-keys').open) $('#dlg-keys').showModal();
}
$('#keysBtn').onclick = openKeys;
let OB = 0; const OB_IC = ['🗂️','⌨️','✅','🔗','🚀'];
function renderOB(){
  $('#ob-ic').textContent = OB_IC[OB]; $('#ob-t').textContent = t('ob'+(OB+1)+'t'); $('#ob-b').innerHTML = t('ob'+(OB+1));
  $('#ob-dots').innerHTML = OB_IC.map((_,i)=>`<i class="${i===OB?'on':''}"></i>`).join('');
  $('#ob-back').textContent = t('back'); $('#ob-back').hidden = OB===0;
  $('#ob-skip').textContent = t('skip'); $('#ob-skip').hidden = OB===OB_IC.length-1;
  $('#ob-next').textContent = OB===OB_IC.length-1 ? t('done') : t('next');
}
function openOB(){ OB = 0; renderOB(); $('#dlg-ob').showModal(); $('#ob-next').focus(); }
function closeOB(){ $('#dlg-ob').close(); try{localStorage.setItem('billsplit.onboarded','1')}catch{} }
$('#ob-next').onclick = ()=>{ if(OB===OB_IC.length-1) closeOB(); else { OB++; renderOB(); } };
$('#ob-back').onclick = ()=>{ OB--; renderOB(); };
$('#ob-skip').onclick = closeOB;
$('#dlg-ob').addEventListener('keydown', e=>{ if(e.key==='ArrowRight') $('#ob-next').click(); if(e.key==='ArrowLeft' && OB>0) $('#ob-back').click(); });
$('#dlg-ob').addEventListener('close', ()=>{ try{localStorage.setItem('billsplit.onboarded','1')}catch{} });
$('#help').onclick = openOB;

// ---------- dialogs: close on backdrop click (Esc is native)
document.querySelectorAll('dialog').forEach(d=>{
  let down = false;
  const outside = e => { const r = d.getBoundingClientRect(); return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom; };
  d.addEventListener('mousedown', e=>{ down = e.target===d && outside(e); });
  d.addEventListener('click', e=>{ if(down && e.target===d && outside(e)) d.close(); down = false; });
});

// ---------- theme: system -> light -> dark
const ICONS = {
  system:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
};
let THEME = 'system'; try{ THEME = localStorage.getItem('billsplit.theme') || 'system'; }catch{}
function applyTheme(){
  if(THEME==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = THEME;
  $('#themeBtn').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[THEME]}</svg>`;
  $('#themeBtn').title = t('theme')+': '+t('theme_'+THEME);
}
$('#themeBtn').onclick = ()=>{ THEME = {system:'light',light:'dark',dark:'system'}[THEME]; try{localStorage.setItem('billsplit.theme',THEME)}catch{} applyTheme(); toast(t('theme')+': '+t('theme_'+THEME)); };

// ---------- global keys
function toggleDense(){ UI.dense = !UI.dense; try{localStorage.setItem('billsplit.dense',UI.dense?'1':'0')}catch{} renderAll(); }
$('#dense').onclick = toggleDense;
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.code==='KeyK'){ e.preventDefault(); if($('#dlg-cmd').open) $('#dlg-cmd').close(); else openCmd(); return; }
  const tg = e.target, typing = !!(tg.matches && tg.matches('input,textarea,select,[contenteditable]'));
  if(typing || document.querySelector('dialog[open]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  else if(e.key==='?'){ e.preventDefault(); openKeys(); }
  else if(e.key==='['){ stepTab(-1); }
  else if(e.key===']'){ stepTab(1); }
  else if(e.key==='t'||e.key==='T'){ e.preventDefault(); newTable(); }
  else if(e.key==='r'||e.key==='R'){ e.preventDefault(); openRoster(); }
  else if(e.key==='m'||e.key==='M'){ e.preventDefault(); openMatch(); }
  else if(e.key==='c'||e.key==='C'){ toggleDense(); }
});

$('#in-tax').addEventListener('input', e=>{ S.tax=e.target.value; update(); });
$('#in-tip').addEventListener('input', e=>{ S.tip=e.target.value; update(); });

$('#copyunpaid').onclick = ()=>copyText(unpaidText());

  S.tables.forEach(tb=>tb.amt={f:'',b:'',s:''});
  S.people.forEach(p=>{p.f=true;p.b=false;p.s=false;p.paid=false;p.got='';});
  renderAll(); toast(t('fresh'));
};
$('#clear').onclick = ()=>{
  if(!confirm(t('confirmClear'))) return;
  const keep = S.roster; S = blank(); S.roster = keep; UI.open.clear(); UI.view='all'; $('#in-tax').value=S.tax; $('#in-tip').value=S.tip; renderAll();

$('#lang').onclick = ()=>{ LANG = LANG==='ko'?'en':'ko'; try{localStorage.setItem('billsplit.lang',LANG)}catch{} applyLang(); applyTheme(); renderAll();
  if($('#dlg-match').open) renderMatches(); if($('#dlg-ob').open) renderOB(); if($('#dlg-keys').open) openKeys(); if($('#dlg-roster').open) renderRoster(); };
applyLang(); applyTheme(); renderAll();
try{ if(!localStorage.getItem('billsplit.onboarded')) openOB(); }catch{}
